<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5b6cff" />
  <title>RFM 客户分群 · 小数</title>
  <meta name="description" content="电商数据分析教学工具：用最近消费 R、消费频次 F、消费金额 M 给客户五分位打分，聚成 8 类客户群，对比规模与价值贡献。纯前端，无需后端。" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .rfm-chart { width: 100%; height: 320px; margin-top: 10px; }
    #rfm-cloud-wrap { width: 100%; height: 240px; margin-top: 10px; }
    .rfm-input { width: 100%; min-height: 96px; border: 1px solid #dde0ea; border-radius: 10px; padding: 9px 10px; font-size: 13px; font-family: inherit; resize: vertical; }
    .rfm-table { max-height: 280px; overflow: auto; margin-top: 10px; border: 1px solid #e7e9f3; border-radius: 10px; }
    .rfm-table table { border-collapse: collapse; width: 100%; font-size: 12px; }
    .rfm-table th, .rfm-table td { padding: 6px 8px; text-align: center; border-bottom: 1px solid #f0f1f7; white-space: nowrap; }
    .rfm-table th { position: sticky; top: 0; background: #f7f8fd; color: var(--ink-soft); }
    .rfm-score { font-weight: 700; color: var(--primary); }
    .app-bar-back {
      display: inline-block; font-size: 13px; color: #fff; opacity: .92;
      text-decoration: none; margin-bottom: 6px;
    }
    .app-bar-back:hover { opacity: 1; }
    .kp-card { background: #f7f8fd; border: 1px solid #e7e9f3; border-left: 3px solid #5b6cff; border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
    .kp-title { font-weight: 700; font-size: 13px; color: #1f2440; margin-bottom: 4px; }
    .kp-body { font-size: 13px; color: #5a6072; line-height: 1.65; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="app-bar">
      <a class="app-bar-back" href="index.html">← 课程工具</a>
      <div class="app-bar-title">👥 RFM 客户分群 · 小数</div>
      <div class="app-bar-sub">电商运营教学验证工具 · 教师主导</div>
    </header>

    <main class="screen">
      <section class="welcome" id="rfm-welcome"></section>

      <!-- 配置数据管理 -->
      <details class="data-mgr" id="data-mgr">
        <summary class="data-mgr-sum">
          <span>🛠️ 配置数据管理</span>
          <span class="src-badge" id="src-badge">内置默认</span>
        </summary>
        <div class="data-mgr-body">
          <p class="dm-hint">客户清单、分位档数、分群标签与说明、误区词云等均可编辑。修改后导出 JSON，下次可一键更新，保持数据最新。</p>
          <div class="dm-actions">
            <button class="btn btn-sm" id="btn-export">⬇️ 导出当前JSON</button>
            <button class="btn btn-sm" id="btn-import">⬆️ 导入JSON文件</button>
            <input type="file" id="file-import" accept=".json,application/json" hidden />
            <button class="btn btn-sm btn-warn" id="btn-reset-config">↺ 恢复内置默认</button>
            <a class="btn btn-sm btn-primary" id="btn-editor" href="rfm-editor.html" style="text-decoration:none;display:inline-flex;align-items:center;">🖊️ 在线编辑</a>
          </div>
          <div class="dm-update">
            <label class="dm-url-label" for="update-url">一键更新地址</label>
            <div class="dm-url-row">
              <input type="text" id="update-url" class="dm-url" placeholder="./rfm-config.json" value="./rfm-config.json" inputmode="url" />
              <button class="btn btn-sm btn-primary" id="btn-fetch-update">🔄 一键更新</button>
            </div>
          </div>
          <p class="dm-note" id="dm-note"></p>
        </div>
      </details>

      <!-- ① 客户数据 -->
      <section class="block">
        <div class="block-title">① 客户数据</div>
        <p class="bench-logic">每行一位客户：<b>姓名, 最近消费天数(R), 消费频次(F), 消费金额(M)</b>。可先点「载入内置示例」。</p>
        <textarea class="rfm-input" id="rfm-input" placeholder="张伟,12,18,3200&#10;王芳,80,3,460&#10;李娜,5,25,5600"></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" id="rfm-apply">应用数据</button>
          <button class="btn btn-ghost" id="rfm-load">载入内置示例</button>
        </div>
      </section>

      <!-- ② RFM 评分 -->
      <section class="block">
        <div class="block-title">② RFM 评分（五分位 1–5）</div>
        <button class="btn btn-primary" id="rfm-scores" disabled>RFM 评分</button>
        <div id="rfm-table-wrap"></div>
      </section>

      <!-- ③ 客户分群散点 -->
      <section class="block">
        <div class="block-title">③ 客户分群散点（频次 × 金额）</div>
        <button class="btn btn-primary" id="rfm-scatter" disabled>绘制分群散点</button>
        <div class="rfm-chart" id="rfm-scatter-wrap"></div>
      </section>

      <!-- ④ 分群规模 -->
      <section class="block">
        <div class="block-title">④ 分群规模（各群客户数）</div>
        <button class="btn btn-primary" id="rfm-scale" disabled>统计分群规模</button>
        <div class="rfm-chart" id="rfm-scale-wrap"></div>
      </section>

      <!-- ⑤ 分群价值 -->
      <section class="block">
        <div class="block-title">⑤ 分群价值（金额贡献）</div>
        <button class="btn btn-primary" id="rfm-value" disabled>统计分群价值</button>
        <div class="rfm-chart" id="rfm-value-wrap"></div>
      </section>

      <!-- ⑥ 误区词云 -->
      <section class="block">
        <div class="block-title">⑥ 常见误区 · 词云</div>
        <button class="btn btn-primary" id="rfm-cloud" disabled>生成误区词云</button>
        <div id="rfm-cloud-wrap"></div>
      </section>

      <!-- ⑦ 课堂知识点注解 -->
      <section class="block">
        <div class="block-title">📚 课堂知识点注解</div>
        <p class="bench-logic">RFM 客户分群的核心概念卡片，可在课堂讲解时展开对照。</p>
        <button class="btn btn-primary" id="rfm-knowledge">展开知识点注解</button>
        <div id="rfm-knowledge-wrap"></div>
      </section>

      <footer class="disclaimer" id="rfm-disclaimer"></footer>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="vendor/echarts.min.js"></script>
  <script src="vendor/echarts-wordcloud.min.js"></script>
  <script src="kit/config.js"></script>
  <script src="kit/datamgr.js"></script>
  <script src="js/rfm-config.js"></script>
  <script src="js/rfm-app.js"></script>
</body>
</html>
