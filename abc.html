<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#5b6cff" />
  <title>ABC / 帕累托分析 · 小数</title>
  <meta name="description" content="电商数据分析教学工具：按销售额降序做帕累托分析，按累计占比 80/95 将商品分为 A/B/C 三类，定位关键少数。纯前端，无需后端。" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .abc-chart { width: 100%; height: 340px; margin-top: 10px; }
    #abc-cloud-wrap { width: 100%; height: 240px; margin-top: 10px; }
    .abc-input { width: 100%; min-height: 96px; border: 1px solid #dde0ea; border-radius: 10px; padding: 9px 10px; font-size: 13px; font-family: inherit; resize: vertical; }
    .abc-table { max-height: 300px; overflow: auto; margin-top: 10px; border: 1px solid #e7e9f3; border-radius: 10px; }
    .abc-table table { border-collapse: collapse; width: 100%; font-size: 12px; }
    .abc-table th, .abc-table td { padding: 6px 8px; text-align: center; border-bottom: 1px solid #f0f1f7; white-space: nowrap; }
    .abc-table th { position: sticky; top: 0; background: #f7f8fd; color: var(--ink-soft); }
    .abc-cls { font-weight: 700; }
    .cls-A { color: #5b6cff; }
    .cls-B { color: #e0a300; }
    .cls-C { color: #b0b4c8; }
    .app-bar-back {
      display: inline-block; font-size: 13px; color: #fff; opacity: .92;
      text-decoration: none; margin-bottom: 6px;
    }
    .app-bar-back:hover { opacity: 1; }
  </style>
</head>
<body>
  <div class="phone">
    <header class="app-bar">
      <a class="app-bar-back" href="index.html">← 课程工具</a>
      <div class="app-bar-title">📊 ABC / 帕累托分析 · 小数</div>
      <div class="app-bar-sub">电商运营教学验证工具 · 教师主导</div>
    </header>

    <main class="screen">
      <section class="welcome" id="abc-welcome"></section>

      <!-- 配置数据管理 -->
      <details class="data-mgr" id="data-mgr">
        <summary class="data-mgr-sum">
          <span>🛠️ 配置数据管理</span>
          <span class="src-badge" id="src-badge">内置默认</span>
        </summary>
        <div class="data-mgr-body">
          <p class="dm-hint">商品清单、累计占比阈值、文案、误区词云等均可编辑。修改后导出 JSON，下次可一键更新，保持数据最新。</p>
          <div class="dm-actions">
            <button class="btn btn-sm" id="btn-export">⬇️ 导出当前JSON</button>
            <button class="btn btn-sm" id="btn-import">⬆️ 导入JSON文件</button>
            <input type="file" id="file-import" accept=".json,application/json" hidden />
            <button class="btn btn-sm btn-warn" id="btn-reset-config">↺ 恢复内置默认</button>
            <a class="btn btn-sm btn-primary" id="btn-editor" href="abc-editor.html" style="text-decoration:none;display:inline-flex;align-items:center;">🖊️ 在线编辑</a>
          </div>
          <div class="dm-update">
            <label class="dm-url-label" for="update-url">一键更新地址</label>
            <div class="dm-url-row">
              <input type="text" id="update-url" class="dm-url" placeholder="./abc-config.json" value="./abc-config.json" inputmode="url" />
              <button class="btn btn-sm btn-primary" id="btn-fetch-update">🔄 一键更新</button>
            </div>
          </div>
          <p class="dm-note" id="dm-note"></p>
        </div>
      </details>

      <!-- ① 商品数据 -->
      <section class="block">
        <div class="block-title">① 商品数据</div>
        <p class="bench-logic">每行一个商品：<b>商品名, 销售额</b>。可先点「载入内置示例」。</p>
        <textarea class="abc-input" id="abc-input" placeholder="连衣裙,8600&#10;运动鞋,5200&#10;保温杯,1200"></textarea>
        <div class="btn-row">
          <button class="btn btn-primary" id="abc-apply">应用数据</button>
          <button class="btn btn-ghost" id="abc-load">载入内置示例</button>
        </div>
      </section>

      <!-- ② 排序与累计 -->
      <section class="block">
        <div class="block-title">② 排序与累计占比</div>
        <button class="btn btn-primary" id="abc-sort" disabled>排序与累计</button>
        <div id="abc-table-wrap"></div>
      </section>

      <!-- ③ 帕累托图 -->
      <section class="block">
        <div class="block-title">③ 帕累托图（销售额 + 累计占比）</div>
        <button class="btn btn-primary" id="abc-pareto" disabled>生成帕累托图</button>
        <div class="abc-chart" id="abc-pareto-wrap"></div>
      </section>

      <!-- ④ ABC 分类汇总 -->
      <section class="block">
        <div class="block-title">④ ABC 分类汇总</div>
        <button class="btn btn-primary" id="abc-summary" disabled>分类汇总</button>
        <div id="abc-summary-wrap"></div>
      </section>

      <!-- ⑤ 误区词云 -->
      <section class="block">
        <div class="block-title">⑤ 常见误区 · 词云</div>
        <button class="btn btn-primary" id="abc-cloud" disabled>生成误区词云</button>
        <div id="abc-cloud-wrap"></div>
      </section>

      <footer class="disclaimer" id="abc-disclaimer"></footer>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="vendor/echarts.min.js"></script>
  <script src="vendor/echarts-wordcloud.min.js"></script>
  <script src="kit/config.js"></script>
  <script src="kit/datamgr.js"></script>
  <script src="js/abc-config.js"></script>
  <script src="js/abc-app.js"></script>
</body>
</html>
